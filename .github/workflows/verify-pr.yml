name: Verify PR
on:
  pull_request:
    paths:
      - 'data/sites/**'
      - 'data/repos/**'

# Runs code from pull requests: read-only, whatever the repo default is.
permissions:
  contents: read

jobs:
  verify-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check-data
      - name: Find changed sites
        run: |
          git diff --name-only origin/main...HEAD -- 'data/sites/' > changed_files.txt
          cat changed_files.txt
      - name: Verify new/changed site entries
        run: npx tsx scripts/verify-pr.ts
        env:
          OPENPAGERANK_API_KEY: ${{ secrets.OPENPAGERANK_API_KEY }}
      - name: Comment site results
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: always()
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('verify-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  verify-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check-data
      - name: Find changed repos
        run: |
          git diff --name-only origin/main...HEAD -- 'data/repos/' > changed_files.txt
          cat changed_files.txt
      - name: Verify new/changed repo entries
        run: npx tsx scripts/verify-repo-pr.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment repo results
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: always()
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('verify-repo-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
