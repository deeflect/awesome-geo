name: Weekly Re-verification
on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday 6am UTC
  workflow_dispatch:

# create-pull-request needs to push a branch and open a PR; the default token is read-only.
permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # keep the write token away from npm and the site checks; the PR step brings its own
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check-data
      - name: Re-verify all sites
        run: npx tsx scripts/verify-all.ts
        env:
          OPENPAGERANK_API_KEY: ${{ secrets.OPENPAGERANK_API_KEY }}
      - name: Recalculate scores
        run: npx tsx scripts/score-sites.ts
      - name: Regenerate README
        run: npx tsx scripts/generate-readme.ts
      - name: Create PR if changed
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "data: weekly re-verification"
          title: "🔄 Weekly Site Re-verification"
          branch: auto/weekly-verify
          body: "Automated weekly re-verification of all sites."
